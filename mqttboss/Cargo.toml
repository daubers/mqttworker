[package]
name = "mqttboss"
version = "0.1.0"
edition = "2024"

[dependencies]
paho-mqtt = "0.13.3"
diesel = { version = "2.3.6", features = ["postgres", "chrono", "serde_json"] }
dotenvy = "0.15.7"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["serde_derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
messages = {path = "../messages"}