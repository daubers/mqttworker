[package]
name = "mqttworker"
version = "0.1.0"
edition = "2024"

[dependencies]
paho-mqtt = "0.14.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
tokio-cron-scheduler = { version = "*", features = ["signal"] }
toml = { version="1.1.5", features = ["serde"]}
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.5", features = ["derive"] }
smol = "2.0.2"
bollard = "*"
futures-util = "0.3.32"
termion = "4.0.6"
regex = "1.13.1"
messages = {path = "../messages"}
json = "0.12.4"
serde_json = "1.0.149"
uuid = { version = "1.22.0", features = ["v4"] }
sha2 = "0.11.0"
hex = "0.4.3"