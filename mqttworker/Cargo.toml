[package]
name = "mqttworker"
version = "0.1.0"
edition = "2024"

[dependencies]
paho-mqtt = "0.14.0"
messages = {path = "../messages"}
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
tokio-cron-scheduler = { version = "*", features = ["signal"] }
toml = { version="1.1.3+spec-1.1.0", features = ["serde"]}
serde = { version = "1.0.228", features = ["derive"] }
clap = { version = "4.6.2", features = ["derive"] }